[pytest]
# Configuration pytest pour Coda2z

# Répertoires de tests
testpaths = tests

# Pattern des fichiers de tests
python_files = test_*.py

# Pattern des classes de tests
python_classes = Test*

# Pattern des fonctions de tests
python_functions = test_*

# Options par défaut
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# Markers personnalisés
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    slow: Tests lents (> 1 seconde)
    asyncio: Tests asynchrones

# Mode asyncio
asyncio_mode = auto

# Timeout par défaut (secondes)
timeout = 30

# Désactiver les warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage (si installé)
# Décommentez pour activer la couverture de code
# addopts = --cov=app --cov-report=html --cov-report=term-missing

# Ordre d'exécution des tests
# console_output_style = progress

# Logging pendant les tests
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Fichier de log
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
